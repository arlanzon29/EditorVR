<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor VR</title>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.7.0/dist/aframe-master.min.js"></script>
<script>
// Giro por pasos con el joystick derecho: a un lado gira 30°.
// Hay que volver el joystick al centro para girar otra vez.
const PASO_GIRO = 30;

AFRAME.registerComponent('giro-por-pasos', {
  init() {
    this.girado = false;
    this.rig = document.getElementById('rig');
    this.el.addEventListener('thumbstickmoved', e => {
      const x = e.detail.x;
      if (Math.abs(x) > 0.7 && !this.girado) { this.girar(x > 0 ? -PASO_GIRO : PASO_GIRO); this.girado = true; }
      if (Math.abs(x) < 0.3) this.girado = false;
    });
  },
  girar(grados) {
    // girar alrededor de la cabeza, no del centro del rig, para no desplazarse al girar
    const rig = this.rig.object3D;
    const cabeza = document.querySelector('[camera]').object3D.getWorldPosition(new THREE.Vector3());
    const a = THREE.MathUtils.degToRad(grados);
    const off = rig.position.clone().sub(cabeza).applyAxisAngle(new THREE.Vector3(0, 1, 0), a);
    rig.position.set(cabeza.x + off.x, rig.position.y, cabeza.z + off.z);
    rig.rotation.y += a;
  }
});

// Andar con el joystick izquierdo, hacia donde miras (sin subir ni bajar).
const VELOCIDAD = 1.5;   // m/s
// Zonas por las que puede ir la cabeza (con un margen para no meterse en las paredes).
// El pasillo y la segunda habitación solo se alcanzan desde la primera con la puerta abierta.
const SALA = { x0: -2.75, x1: 2.75, z0: -2.75, z1: 2.75 };
const PASILLO = { x0: 2.5, x1: 9.5, z0: -0.3, z1: 0.3 };
const SALA2 = { x0: 9.25, x1: 13.75, z0: -2.25, z1: 2.25 };
const dentro = (p, z) => p.x >= z.x0 && p.x <= z.x1 && p.z >= z.z0 && p.z <= z.z1;

AFRAME.registerComponent('andar-joystick', {
  init() {
    this.x = 0; this.y = 0;
    this.rig = document.getElementById('rig');
    this.el.addEventListener('thumbstickmoved', e => { this.x = e.detail.x; this.y = e.detail.y; });
  },
  tick(t, dt) {
    if (!dt || Math.hypot(this.x, this.y) < 0.15) return;   // zona muerta
    const s = Math.min(dt / 1000, 0.05) * VELOCIDAD;
    const cam = document.querySelector('[camera]').object3D;
    const delante = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.getWorldQuaternion(new THREE.Quaternion()));
    delante.y = 0; delante.normalize();
    const derecha = new THREE.Vector3(-delante.z, 0, delante.x);
    const r = this.rig.object3D.position;
    const enSala = dentro(cam.getWorldPosition(new THREE.Vector3()), SALA);   // antes de moverse
    r.addScaledVector(delante, -this.y * s).addScaledVector(derecha, this.x * s);
    // que la cabeza no atraviese paredes: si sale de las zonas permitidas, vuelve al punto más cercano
    const cabeza = cam.getWorldPosition(new THREE.Vector3());
    const abierta = document.querySelector('[puerta]').components.puerta.abierta;
    const zonas = abierta ? [SALA, PASILLO, SALA2] : enSala ? [SALA] : [PASILLO, SALA2];
    if (zonas.some(z => dentro(cabeza, z))) return;
    let mejor = null, mejorD = Infinity;
    for (const z of zonas) {
      const x = THREE.MathUtils.clamp(cabeza.x, z.x0, z.x1), zz = THREE.MathUtils.clamp(cabeza.z, z.z0, z.z1);
      const d = Math.hypot(cabeza.x - x, cabeza.z - zz);
      if (d < mejorD) { mejorD = d; mejor = { x, z: zz }; }
    }
    r.x += mejor.x - cabeza.x;
    r.z += mejor.z - cabeza.z;
  }
});

// Suelo de tablas de madera dibujado en un canvas (sin imágenes externas).
// La textura cubre 2 × 2 m y se repite según el tamaño del plano.
let texturaMadera = null;
function crearTexturaMadera() {
  const N = 1024, M = 2;                     // píxeles y metros que cubre la textura
  const px = N / M, ancho = 0.15 * px;      // tablas de 15 cm
  const c = document.createElement('canvas');
  c.width = c.height = N;
  const g = c.getContext('2d');
  let semilla = 7;
  const azar = () => (semilla = (semilla * 16807) % 2147483647) / 2147483647;
  for (let y = 0; y < N; y += ancho) {
    let x = -azar() * 1.2 * px;              // juntas escalonadas entre filas
    while (x < N) {
      const largo = (0.8 + azar() * 0.8) * px;
      const h = 26 + azar() * 8, s = 42 + azar() * 14, l = 36 + azar() * 14;
      g.fillStyle = `hsl(${h}, ${s}%, ${l}%)`;
      g.fillRect(x, y, largo, ancho);
      // vetas: líneas finas un poco onduladas
      g.strokeStyle = `hsla(${h - 4}, ${s}%, ${l - 12}%, 0.35)`;
      g.lineWidth = 1;
      for (let v = 0; v < 6; v++) {
        const vy = y + 4 + azar() * (ancho - 8), fase = azar() * 6, amp = 1 + azar() * 2;
        g.beginPath();
        for (let vx = x; vx <= x + largo; vx += 8) g.lineTo(vx, vy + Math.sin(vx / 40 + fase) * amp);
        g.stroke();
      }
      // junta entre tablas
      g.fillStyle = 'rgba(40, 25, 12, 0.55)';
      g.fillRect(x, y, 2, ancho);
      x += largo;
    }
    g.fillStyle = 'rgba(40, 25, 12, 0.6)';
    g.fillRect(0, y, N, 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return { tex, metros: M };
}

AFRAME.registerComponent('suelo-madera', {
  init() {
    this.aplicar = this.aplicar.bind(this);
    this.el.addEventListener('object3dset', this.aplicar);
    this.aplicar();
  },
  aplicar() {
    const malla = this.el.getObject3D('mesh');
    if (!malla) return;
    texturaMadera = texturaMadera || crearTexturaMadera();
    const tex = texturaMadera.tex.clone();   // cada suelo con su propia repetición
    tex.needsUpdate = true;
    const w = parseFloat(this.el.getAttribute('width')), h = parseFloat(this.el.getAttribute('height'));
    tex.repeat.set(w / texturaMadera.metros, h / texturaMadera.metros);
    malla.material.map = tex;
    malla.material.color.set('#ffffff');
    malla.material.roughness = 0.75;
    malla.material.needsUpdate = true;
  }
});

// Puerta que se abre y se cierra al hacer clic en ella: gatillo apuntando con el mando,
// o clic del ratón con la mira en el centro de la pantalla. Gira sobre las bisagras hacia dentro.
// Al apuntarla, el pomo brilla y crece, sale un cartel "Abrir"/"Cerrar" y el rayo se pone verde.
const RAYO = '#ffe066', RAYO_PUERTA = '#5cff8a';

AFRAME.registerComponent('puerta', {
  schema: { abierta: { default: -100 } },   // grados al abrirse
  init() {
    this.abierta = false;
    this.apuntada = false;
    this.pomo = this.el.querySelector('.pomo');
    this.carteles = [...this.el.querySelectorAll('.cartel')];
    this.el.addEventListener('click', () => {
      this.abierta = !this.abierta;
      for (const c of this.carteles) c.querySelector('a-text').setAttribute('value', this.abierta ? 'Cerrar' : 'Abrir');
      this.el.setAttribute('animation', {
        property: 'rotation', to: `0 ${this.abierta ? this.data.abierta : 0} 0`,
        dur: 700, easing: 'easeInOutQuad'
      });
    });
  },
  tick() {
    // ¿algún rayo (mandos o mira) está tocando una parte de la puerta?
    let apuntada = false;
    for (const el of this.el.sceneEl.querySelectorAll('[raycaster]')) {
      const r = el.components.raycaster;
      if (!r || !r.data.enabled) continue;
      const toca = r.intersectedEls.some(e => this.el.contains(e));
      if (el.hasAttribute('laser-controls')) {
        const color = toca ? RAYO_PUERTA : RAYO;
        if (r.data.lineColor !== color) el.setAttribute('raycaster', 'lineColor', color);
      }
      apuntada = apuntada || toca;
    }
    if (apuntada === this.apuntada) return;
    this.apuntada = apuntada;
    for (const p of this.pomo.children) p.setAttribute('material', 'emissive', apuntada ? '#ffcc33' : '#000');
    this.pomo.object3D.scale.setScalar(apuntada ? 1.5 : 1);
    for (const c of this.carteles) c.object3D.visible = apuntada;
  }
});
</script>
</head>
<body>
<!-- De momento, solo una habitación en blanco de 6 × 6 m y 3 m de alto.
     Monitor: WASD + ratón (clic para capturarlo, Esc para soltarlo). Quest: botón VR; joystick izquierdo = andar, derecho a los lados = girar 30°.
     Con la puerta abierta se puede ir por el pasillo hasta la segunda habitación.
     Puerta: apuntar y gatillo (VR) o mira + clic (monitor). -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const s = document.querySelector('a-scene');
    const mira = v => document.querySelector('.mira').setAttribute('visible', v);
    const camara = document.querySelector('[camera]');
    s.addEventListener('enter-vr', () => { mira(false); camara.setAttribute('raycaster', 'enabled', false); });
    s.addEventListener('exit-vr', () => { mira(true); camara.setAttribute('raycaster', 'enabled', true); });
  });
</script>
<a-scene renderer="antialias: true; colorManagement: true" xr-mode-ui="enabled: true" background="color: #ffffff">

  <a-entity id="rig" position="0 0 1.5">
    <a-entity camera look-controls="pointerLockEnabled: true" wasd-controls position="0 1.6 0"
              cursor raycaster="objects: .clicable; far: 4">
      <!-- mira (solo en el monitor) -->
      <a-ring class="mira" radius-inner="0.004" radius-outer="0.007" position="0 0 -0.5"
              material="shader: flat; color: #333; opacity: 0.8"></a-ring>
    </a-entity>
    <a-entity laser-controls="hand: left" raycaster="objects: .clicable; far: 4; lineColor: #ffe066" andar-joystick></a-entity>
    <a-entity laser-controls="hand: right" raycaster="objects: .clicable; far: 4; lineColor: #ffe066" giro-por-pasos></a-entity>
  </a-entity>

  <!-- Luz suave: todo blanco, pero con la sombra justa para distinguir suelo, paredes y techo -->
  <a-entity light="type: ambient; intensity: 2.2; color: #fff"></a-entity>
  <a-entity light="type: directional; intensity: 1.2; color: #fff" position="1 3 2"></a-entity>

  <!-- Habitación -->
  <a-plane rotation="-90 0 0" width="6" height="6" color="#ffffff" suelo-madera></a-plane>
  <a-plane rotation="90 0 0" position="0 3 0" width="6" height="6" color="#8fc0ee"></a-plane>
  <a-plane position="0 1.5 -3" width="6" height="3" color="#f5d94a"></a-plane>
  <a-plane position="0 1.5 3" rotation="0 180 0" width="6" height="3" color="#fafafa"></a-plane>
  <a-plane position="-3 1.5 0" rotation="0 90 0" width="6" height="3" color="#6cc46c"></a-plane>
  <a-plane position="3 1.5 -1.725" rotation="0 -90 0" width="2.55" height="3" color="#f2a0c4" side="double"></a-plane>
  <a-plane position="3 1.5 1.725" rotation="0 -90 0" width="2.55" height="3" color="#f2a0c4" side="double"></a-plane>
  <a-plane position="3 2.525 0" rotation="0 -90 0" width="0.9" height="0.95" color="#f2a0c4" side="double"></a-plane>

  <!-- Ventana en la pared del fondo: cielo, marco blanco y cruceta -->
  <a-plane position="0 1.6 -2.99" width="2" height="1.3" material="shader: flat; color: #9fd4ff"></a-plane>
  <a-plane position="0 1.25 -2.985" width="2" height="0.6" material="shader: flat; color: #c8e8ff; opacity: 0.6"></a-plane>
  <a-box position="0 2.28 -2.96" width="2.16" height="0.08" depth="0.08" color="#ffffff"></a-box>
  <a-box position="0 0.92 -2.96" width="2.16" height="0.08" depth="0.08" color="#ffffff"></a-box>
  <a-box position="0 0.86 -2.92" width="2.3" height="0.04" depth="0.16" color="#ffffff"></a-box>
  <a-box position="-1.04 1.6 -2.96" width="0.08" height="1.44" depth="0.08" color="#ffffff"></a-box>
  <a-box position="1.04 1.6 -2.96" width="0.08" height="1.44" depth="0.08" color="#ffffff"></a-box>
  <a-box position="0 1.6 -2.97" width="0.04" height="1.3" depth="0.04" color="#ffffff"></a-box>
  <a-box position="0 1.6 -2.97" width="2" height="0.04" depth="0.04" color="#ffffff"></a-box>
  <!-- Puerta en la pared rosa: marco blanco fijo y hoja de madera de 0,9 × 2,05 m que se abre.
       Entidad girada para que su Z local apunte hacia dentro de la habitación. -->
  <a-entity position="3 0 0" rotation="0 -90 0">
    <a-box position="-0.49 1.06 0.01" width="0.08" height="2.12" depth="0.1" color="#ffffff"></a-box>
    <a-box position="0.49 1.06 0.01" width="0.08" height="2.12" depth="0.1" color="#ffffff"></a-box>
    <a-box position="0 2.09 0.01" width="1.06" height="0.08" depth="0.1" color="#ffffff"></a-box>
    <a-entity puerta position="-0.45 0 0.02">
      <a-box class="clicable" position="0.45 1.025 0" width="0.9" height="2.05" depth="0.04" color="#9a6a3f"></a-box>
      <a-box position="0.45 1.55 0.025" width="0.66" height="0.7" depth="0.01" color="#8a5d36"></a-box>
      <a-box position="0.45 0.55 0.025" width="0.66" height="0.8" depth="0.01" color="#8a5d36"></a-box>
      <a-box position="0.45 1.55 -0.025" width="0.66" height="0.7" depth="0.01" color="#8a5d36"></a-box>
      <a-box position="0.45 0.55 -0.025" width="0.66" height="0.8" depth="0.01" color="#8a5d36"></a-box>
      <a-entity class="pomo" position="0.78 1 0">
        <a-sphere position="0 0 0.06" radius="0.035" material="color: #d8b04a; metalness: 0.4; roughness: 0.3"></a-sphere>
        <a-cylinder position="0 0 0.035" rotation="90 0 0" radius="0.012" height="0.05" material="color: #d8b04a; metalness: 0.4; roughness: 0.3"></a-cylinder>
        <a-sphere position="0 0 -0.06" radius="0.035" material="color: #d8b04a; metalness: 0.4; roughness: 0.3"></a-sphere>
        <a-cylinder position="0 0 -0.035" rotation="90 0 0" radius="0.012" height="0.05" material="color: #d8b04a; metalness: 0.4; roughness: 0.3"></a-cylinder>
      </a-entity>
      <a-sphere class="clicable" position="0.78 1 0.06" radius="0.09" material="visible: false"></a-sphere>
      <a-sphere class="clicable" position="0.78 1 -0.06" radius="0.09" material="visible: false"></a-sphere>
      <a-entity class="cartel" position="0.66 1.2 -0.08" rotation="0 180 0" visible="false">
        <a-plane width="0.3" height="0.1" material="shader: flat; color: #1c2230; opacity: 0.85; transparent: true"></a-plane>
        <a-text value="Abrir" align="center" color="#ffffff" width="1.2" position="0 0 0.002"></a-text>
      </a-entity>
      <a-entity class="cartel" position="0.66 1.2 0.08" visible="false">
        <a-plane width="0.3" height="0.1" material="shader: flat; color: #1c2230; opacity: 0.85; transparent: true"></a-plane>
        <a-text value="Abrir" align="center" color="#ffffff" width="1.2" position="0 0 0.002"></a-text>
      </a-entity>
    </a-entity>
  </a-entity>

  <!-- Pasillo de 6 m detrás de la puerta (x = 3…9, 1,2 m de ancho, 2,4 m de alto) -->
  <a-plane rotation="-90 0 0" position="6 0 0" width="6" height="1.2" color="#d9d4cc"></a-plane>
  <a-plane rotation="90 0 0" position="6 2.4 0" width="6" height="1.2" color="#ffffff"></a-plane>
  <a-plane position="6 1.2 -0.6" width="6" height="2.4" color="#f4f4f4"></a-plane>
  <a-plane position="6 1.2 0.6" rotation="0 180 0" width="6" height="2.4" color="#f4f4f4"></a-plane>
  <a-entity light="type: point; intensity: 0.8; distance: 4; color: #fff4dc" position="4.5 2.2 0"></a-entity>
  <a-entity light="type: point; intensity: 0.8; distance: 4; color: #fff4dc" position="7.5 2.2 0"></a-entity>

  <!-- Segunda habitación al final del pasillo (x = 9…14, z = -2,5…2,5, 3 m de alto) -->
  <a-plane rotation="-90 0 0" position="11.5 0 0" width="5" height="5" color="#ffffff" suelo-madera></a-plane>
  <a-plane rotation="90 0 0" position="11.5 3 0" width="5" height="5" color="#ffffff"></a-plane>
  <a-plane position="9 1.5 -1.55" rotation="0 90 0" width="1.9" height="3" color="#f4b26b" side="double"></a-plane>
  <a-plane position="9 1.5 1.55" rotation="0 90 0" width="1.9" height="3" color="#f4b26b" side="double"></a-plane>
  <a-plane position="9 2.7 0" rotation="0 90 0" width="1.2" height="0.6" color="#f4b26b" side="double"></a-plane>
  <a-plane position="14 1.5 0" rotation="0 -90 0" width="5" height="3" color="#9b7fd4"></a-plane>
  <a-plane position="11.5 1.5 -2.5" width="5" height="3" color="#f4b26b"></a-plane>
  <a-plane position="11.5 1.5 2.5" rotation="0 180 0" width="5" height="3" color="#f4b26b"></a-plane>
  <a-entity light="type: point; intensity: 1.2; distance: 7; color: #fff4dc" position="11.5 2.7 0"></a-entity>

  <!-- luz que entra por la ventana -->
  <a-entity light="type: point; intensity: 1.5; distance: 6; color: #dff0ff" position="0 1.8 -2.5"></a-entity>
</a-scene>
</body>
</html>
