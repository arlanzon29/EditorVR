<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor VR</title>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.7.0/dist/aframe-master.min.js"></script>
<script>
// Giro por pasos con el joystick derecho: a un lado gira 30°.
// Hay que volver el joystick al centro para girar otra vez.
const PASO_GIRO = 30;

AFRAME.registerComponent('giro-por-pasos', {
  init() {
    this.girado = false;
    this.rig = document.getElementById('rig');
    this.el.addEventListener('thumbstickmoved', e => {
      const x = e.detail.x;
      if (Math.abs(x) > 0.7 && !this.girado) { this.girar(x > 0 ? -PASO_GIRO : PASO_GIRO); this.girado = true; }
      if (Math.abs(x) < 0.3) this.girado = false;
    });
  },
  girar(grados) {
    // girar alrededor de la cabeza, no del centro del rig, para no desplazarse al girar
    const rig = this.rig.object3D;
    const cabeza = document.querySelector('[camera]').object3D.getWorldPosition(new THREE.Vector3());
    const a = THREE.MathUtils.degToRad(grados);
    const off = rig.position.clone().sub(cabeza).applyAxisAngle(new THREE.Vector3(0, 1, 0), a);
    rig.position.set(cabeza.x + off.x, rig.position.y, cabeza.z + off.z);
    rig.rotation.y += a;
  }
});

// Andar con el joystick izquierdo, hacia donde miras (sin subir ni bajar).
const VELOCIDAD = 1.5;   // m/s
// Zonas por las que puede ir la cabeza (con un margen para no meterse en las paredes).
// Cada puerta une dos zonas; con la puerta cerrada no se puede pasar de una a otra.
const SALA = { x0: -2.75, x1: 2.75, z0: -2.75, z1: 2.75 };
const PASILLO = { x0: 2.5, x1: 9.5, z0: -0.3, z1: 0.3 };
const SALA2 = { x0: 9.25, x1: 13.75, z0: -2.25, z1: 2.25 };
const PASILLO2 = { x0: 5.65, x1: 6.35, z0: 0.25, z1: 4.3 };    // ramal del pasillo hacia la sala 3
const SALA3 = { x0: 0.25, x1: 11.75, z0: 4.25, z1: 13.75 };
// Pasillos de arriba, por fuera de los muros de la sala 3 (a 4,4 m), y el arco por el que se
// entra desde el rellano de arriba de la escalera. Solo cuentan si se va a esa altura.
const ARCO_ARRIBA = { x0: 5.65, x1: 6.35, z0: 13.5, z1: 14.9, arriba: true };
const PASILLOS_ARRIBA = [
  { x0: -1.75, x1: 13.75, z0: 14.65, z1: 15.75, arriba: true },   // fondo
  { x0: -1.75, x1: -0.65, z0: 2.25, z1: 15.75, arriba: true },    // lado derecho (entrando a la sala)
  { x0: 12.65, x1: 13.75, z0: 2.25, z1: 15.75, arriba: true },    // lado izquierdo
  { x0: -1.75, x1: 13.75, z0: 2.25, z1: 3.35, arriba: true },     // delante
];
const ALTO_GALERIA = 4.4;   // altura del rellano de arriba de la sala 3 y de sus pasillos
const dentro = (p, z) => p.x >= z.x0 && p.x <= z.x1 && p.z >= z.z0 && p.z <= z.z1;

// Zonas por las que se puede ir desde donde está la cabeza: la suya y las que se alcanzan
// cruzando puertas abiertas. Con una puerta cerrada, el pasillo se queda a 25 cm de ella.
// Las zonas "arriba" (pasillos de la sala 3) solo valen si se pisa a la altura de la galería.
function zonasPermitidas(cabeza, altura) {
  const enAlto = altura > ALTO_GALERIA - 0.1;
  const abierta = id => document.getElementById(id).components.puerta.abierta;
  const p1 = abierta('puerta1'), p2 = abierta('puerta2'), p3 = abierta('puerta3');
  const pasillo = { x0: p1 ? PASILLO.x0 : 3.25, x1: p2 ? PASILLO.x1 : 8.75, z0: PASILLO.z0, z1: PASILLO.z1 };
  const pasillo2 = { x0: PASILLO2.x0, x1: PASILLO2.x1, z0: p3 ? PASILLO2.z0 : 0.85, z1: PASILLO2.z1 };
  const zonas = [SALA, pasillo, SALA2, pasillo2, SALA3, ARCO_ARRIBA, ...PASILLOS_ARRIBA];
  const uniones = [[0, 1, p1], [1, 2, p2], [1, 3, p3], [3, 4, true],
    [4, 5, enAlto], [5, 6, enAlto], [6, 7, true], [6, 8, true], [7, 9, true], [8, 9, true]];
  const i = zonas.findIndex(z => dentro(cabeza, z) && (enAlto || !z.arriba));
  if (i < 0) return zonas.filter(z => enAlto || !z.arriba);   // fuera de todo (no debería pasar): que pueda volver a cualquiera
  const alcanzables = new Set([i]);
  for (let otra = true; otra;) {
    otra = false;
    for (const [a, b, abierta] of uniones)
      if (abierta && alcanzables.has(a) !== alcanzables.has(b)) { alcanzables.add(a); alcanzables.add(b); otra = true; }
  }
  return [...alcanzables].map(k => zonas[k]);
}

// Superficies pisables por encima del suelo (escalera y entreplanta de la sala 3), en el mundo.
// Se sube o se baja si el escalón es de 35 cm o menos; más alto, se pasa por debajo (entreplanta)
// o, si es macizo (peldaños hasta el suelo, pilares), no se puede pasar. Tampoco se puede caer.
const SUPERFICIES = [];
const ESCALON_MAX = 0.35;
function sueloEn(p, actual) {
  let suelo = 0;
  for (const s of SUPERFICIES) {
    if (!dentro(p, s)) continue;
    if (s.y > actual + ESCALON_MAX) { if (s.macizo) return null; continue; }
    suelo = Math.max(suelo, s.y);
  }
  return suelo < actual - ESCALON_MAX ? null : suelo;
}

// dónde estaba (localStorage); la clave lleva el punto de inicio del rig, para que al cambiarlo
// en el HTML se empiece allí y no en el sitio guardado de antes
const CLAVE_SITIO = 'editorvr-sitio';

AFRAME.registerComponent('andar-joystick', {
  init() {
    this.x = 0; this.y = 0;
    // en el ordenador, WASD o flechas hacen lo mismo que el joystick (antes era wasd-controls,
    // que movía la cámara sin choques ni escalones)
    this.tx = 0; this.ty = 0;
    const teclas = new Set();
    const pulsada = (...c) => c.some(k => teclas.has(k)) ? 1 : 0;
    const actualizar = () => {
      this.tx = pulsada('KeyD', 'ArrowRight') - pulsada('KeyA', 'ArrowLeft');
      this.ty = pulsada('KeyS', 'ArrowDown') - pulsada('KeyW', 'ArrowUp');
    };
    window.addEventListener('keydown', e => { teclas.add(e.code); actualizar(); });
    window.addEventListener('keyup', e => { teclas.delete(e.code); actualizar(); });
    window.addEventListener('blur', () => { teclas.clear(); actualizar(); });
    this.altura = 0;   // altura del suelo que se pisa
    this.rig = document.getElementById('rig');
    // al recargar, volver al sitio donde se estaba (se guarda en el navegador cada medio segundo)
    this.guardado = 0;
    const inicio = n => Element.prototype.getAttribute.call(this.rig, n) || '';
    this.clave = CLAVE_SITIO + ' ' + inicio('position') + ' / ' + inicio('rotation');
    // (cuando la escena ha cargado: si no, la posición inicial del rig lo pisaría)
    const volver = () => {
      try {
        const p = JSON.parse(localStorage.getItem(this.clave));
        if (!p) return;
        this.rig.object3D.position.set(p.x, p.y, p.z);
        this.rig.object3D.rotation.y = p.giro;
        this.altura = p.y;
      } catch (e) {}
    };
    if (this.el.sceneEl.hasLoaded) volver(); else this.el.sceneEl.addEventListener('loaded', volver, { once: true });
    this.el.addEventListener('thumbstickmoved', e => { this.x = e.detail.x; this.y = e.detail.y; });
  },
  tick(t, dt) {
    if (!dt) return;
    const r = this.rig.object3D.position;
    if (t - this.guardado > 500) {
      this.guardado = t;
      try { localStorage.setItem(this.clave, JSON.stringify({ x: r.x, y: this.altura, z: r.z, giro: this.rig.object3D.rotation.y })); } catch (e) {}
    }
    r.y += (this.altura - r.y) * Math.min(1, dt / 80);   // subir y bajar escalones con suavidad
    const mx = THREE.MathUtils.clamp(this.x + this.tx, -1, 1), my = THREE.MathUtils.clamp(this.y + this.ty, -1, 1);
    if (Math.hypot(mx, my) < 0.15) return;   // zona muerta
    const s = Math.min(dt / 1000, 0.05) * VELOCIDAD;
    const cam = document.querySelector('[camera]').object3D;
    const delante = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.getWorldQuaternion(new THREE.Quaternion()));
    delante.y = 0; delante.normalize();
    const derecha = new THREE.Vector3(-delante.z, 0, delante.x);
    const zonas = zonasPermitidas(cam.getWorldPosition(new THREE.Vector3()), this.altura);   // antes de moverse
    const antes = r.clone();
    r.addScaledVector(delante, -my * s).addScaledVector(derecha, mx * s);
    const cabeza = cam.getWorldPosition(new THREE.Vector3());
    // escalones: subir o bajar; si hay un obstáculo macizo o un desnivel, no se mueve
    const suelo = sueloEn(cabeza, this.altura);
    if (suelo === null) { r.x = antes.x; r.z = antes.z; return; }
    this.altura = suelo;
    // que la cabeza no atraviese paredes: si sale de las zonas permitidas, vuelve al punto más cercano
    if (zonas.some(z => dentro(cabeza, z))) return;
    let mejor = null, mejorD = Infinity;
    for (const z of zonas) {
      const x = THREE.MathUtils.clamp(cabeza.x, z.x0, z.x1), zz = THREE.MathUtils.clamp(cabeza.z, z.z0, z.z1);
      const d = Math.hypot(cabeza.x - x, cabeza.z - zz);
      if (d < mejorD) { mejorD = d; mejor = { x, z: zz }; }
    }
    r.x += mejor.x - cabeza.x;
    r.z += mejor.z - cabeza.z;
  }
});

// Suelo de tablas de madera dibujado en un canvas (sin imágenes externas).
// La textura cubre 2 × 2 m y se repite según el tamaño del plano.
let texturaMadera = null;
function crearTexturaMadera() {
  const N = 1024, M = 2;                     // píxeles y metros que cubre la textura
  const px = N / M, ancho = 0.15 * px;      // tablas de 15 cm
  const c = document.createElement('canvas');
  c.width = c.height = N;
  const g = c.getContext('2d');
  let semilla = 7;
  const azar = () => (semilla = (semilla * 16807) % 2147483647) / 2147483647;
  for (let y = 0; y < N; y += ancho) {
    let x = -azar() * 1.2 * px;              // juntas escalonadas entre filas
    while (x < N) {
      const largo = (0.8 + azar() * 0.8) * px;
      const h = 26 + azar() * 8, s = 42 + azar() * 14, l = 36 + azar() * 14;
      g.fillStyle = `hsl(${h}, ${s}%, ${l}%)`;
      g.fillRect(x, y, largo, ancho);
      // vetas: líneas finas un poco onduladas
      g.strokeStyle = `hsla(${h - 4}, ${s}%, ${l - 12}%, 0.35)`;
      g.lineWidth = 1;
      for (let v = 0; v < 6; v++) {
        const vy = y + 4 + azar() * (ancho - 8), fase = azar() * 6, amp = 1 + azar() * 2;
        g.beginPath();
        for (let vx = x; vx <= x + largo; vx += 8) g.lineTo(vx, vy + Math.sin(vx / 40 + fase) * amp);
        g.stroke();
      }
      // junta entre tablas
      g.fillStyle = 'rgba(40, 25, 12, 0.55)';
      g.fillRect(x, y, 2, ancho);
      x += largo;
    }
    g.fillStyle = 'rgba(40, 25, 12, 0.6)';
    g.fillRect(0, y, N, 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return { tex, metros: M };
}

AFRAME.registerComponent('suelo-madera', {
  init() {
    this.aplicar = this.aplicar.bind(this);
    this.el.addEventListener('object3dset', this.aplicar);
    this.aplicar();
  },
  aplicar() {
    const malla = this.el.getObject3D('mesh');
    if (!malla) return;
    texturaMadera = texturaMadera || crearTexturaMadera();
    const tex = texturaMadera.tex.clone();   // cada suelo con su propia repetición
    tex.needsUpdate = true;
    const w = parseFloat(this.el.getAttribute('width')), h = parseFloat(this.el.getAttribute('height'));
    tex.repeat.set(w / texturaMadera.metros, h / texturaMadera.metros);
    malla.material.map = tex;
    malla.material.color.set('#ffffff');
    malla.material.roughness = 0.75;
    malla.material.needsUpdate = true;
  }
});

// Pared de piedra: sillares grises y beis en hileras, con juntas de mortero, dibujados
// en un canvas. La textura cubre 2 × 2 m y se repite sin cortes según el tamaño del plano.
let texturaPiedra = null;
function crearTexturaPiedra() {
  const N = 1024, M = 2, px = N / M;
  const c = document.createElement('canvas');
  c.width = c.height = N;
  const g = c.getContext('2d');
  let semilla = 23;
  const azar = () => (semilla = (semilla * 16807) % 2147483647) / 2147483647;
  g.fillStyle = '#8c8478';                       // mortero
  g.fillRect(0, 0, N, N);
  const alturas = [0.24, 0.3, 0.22, 0.28, 0.26, 0.2, 0.25, 0.25];   // suman 2 m: hileras que encajan al repetir
  const junta = 0.012 * px;
  let y = 0;
  for (const a of alturas) {
    const h = a * px;
    const inicio = azar() * N;
    let x = inicio;
    while (x < inicio + N - 1) {
      let w = (0.3 + azar() * 0.35) * px;
      if (inicio + N - (x + w) < 0.18 * px) w = inicio + N - x;   // el último cierra la hilera
      const l = 52 + azar() * 16, s = 6 + azar() * 10, tono = 30 + azar() * 15;
      for (const dx of [0, -N]) {                // dibujar también desplazado para que repita sin cortes
        const bx = x + dx;
        g.fillStyle = `hsl(${tono}, ${s}%, ${l}%)`;
        g.fillRect(bx + junta, y + junta, w - 2 * junta, h - 2 * junta);
        // moteado de la piedra
        for (let k = 0; k < 60; k++) {
          g.fillStyle = `hsla(${tono}, ${s}%, ${l + (azar() - 0.5) * 20}%, 0.5)`;
          g.fillRect(bx + junta + azar() * (w - 2 * junta - 6), y + junta + azar() * (h - 2 * junta - 6), 2 + azar() * 6, 2 + azar() * 6);
        }
        // borde de arriba más claro y de abajo más oscuro: algo de relieve
        g.fillStyle = 'rgba(255, 255, 255, 0.12)';
        g.fillRect(bx + junta, y + junta, w - 2 * junta, 4);
        g.fillStyle = 'rgba(0, 0, 0, 0.18)';
        g.fillRect(bx + junta, y + h - junta - 5, w - 2 * junta, 5);
      }
      x += w;
    }
    y += h;
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return { tex, metros: M };
}

AFRAME.registerComponent('pared-piedra', {
  init() {
    this.aplicar = this.aplicar.bind(this);
    this.el.addEventListener('object3dset', this.aplicar);
    this.aplicar();
  },
  aplicar() {
    const malla = this.el.getObject3D('mesh');
    if (!malla) return;
    texturaPiedra = texturaPiedra || crearTexturaPiedra();
    const tex = texturaPiedra.tex.clone();
    tex.needsUpdate = true;
    const w = parseFloat(this.el.getAttribute('width')), h = parseFloat(this.el.getAttribute('height'));
    tex.repeat.set(w / texturaPiedra.metros, h / texturaPiedra.metros);
    // que las piedras casen entre trozos de pared (alrededor de la ventana, encima de la puerta):
    // la textura empieza según dónde cae la esquina inferior izquierda del plano en el mundo
    const o = this.el.object3D;
    o.updateMatrixWorld(true);
    const ejeX = new THREE.Vector3(1, 0, 0).transformDirection(o.matrixWorld);
    const esquina = new THREE.Vector3(-w / 2, -h / 2, 0).applyMatrix4(o.matrixWorld);
    tex.offset.set(esquina.dot(ejeX) / texturaPiedra.metros, esquina.y / texturaPiedra.metros);
    malla.material.map = tex;
    malla.material.color.set('#ffffff');
    malla.material.roughness = 0.95;
    malla.material.needsUpdate = true;
  }
});

// Piedra para cualquier caja: pone la textura de piedra en todas sus caras a escala real,
// alineada con el mundo (las hileras casan entre cajas vecinas, como en un muro de sillares).
// Calcula las coordenadas de textura de cada cara según hacia dónde mira; la geometría se
// copia para no tocar la que A-Frame comparte entre cajas iguales.
AFRAME.registerComponent('piedra-mundo', {
  init() {
    const aplicar = () => {
      const malla = this.el.getObject3D('mesh');
      if (!malla) return;
      texturaPiedra = texturaPiedra || crearTexturaPiedra();
      this.el.object3D.updateWorldMatrix(true, true);
      const geo = malla.geometry.clone(), pos = geo.attributes.position, nor = geo.attributes.normal, uv = geo.attributes.uv;
      const v = new THREE.Vector3(), n = new THREE.Vector3(), M = texturaPiedra.metros;
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i).applyMatrix4(malla.matrixWorld);
        n.fromBufferAttribute(nor, i).transformDirection(malla.matrixWorld);
        const ax = Math.abs(n.x), ay = Math.abs(n.y), az = Math.abs(n.z);
        if (ax >= ay && ax >= az) uv.setXY(i, -v.z * Math.sign(n.x) / M, v.y / M);
        else if (ay >= az) uv.setXY(i, v.x / M, v.z / M);
        else uv.setXY(i, v.x * Math.sign(n.z) / M, v.y / M);
      }
      uv.needsUpdate = true;
      malla.geometry = geo;
      const tex = texturaPiedra.tex.clone();
      tex.needsUpdate = true;
      malla.material.map = tex;
      malla.material.color.set('#ffffff');
      malla.material.roughness = 0.95;
      malla.material.needsUpdate = true;
    };
    // cuando la caja ya tiene su posición y su malla
    if (this.el.hasLoaded) aplicar(); else this.el.addEventListener('loaded', aplicar, { once: true });
  }
});

// Arco ciego de medio punto sobre un muro: hueco oscuro con forma de arco y, alrededor, un
// arco de dovelas de piedra que sobresale un poco. Mira hacia +z local; la base está en y = 0.
AFRAME.registerComponent('arco-ciego', {
  schema: { ancho: { default: 1.6 }, alto: { default: 1.8 }, dovela: { default: 0.2 } },
  init() {
    const { ancho, alto, dovela } = this.data, r = ancho / 2, recto = alto - r;
    const arco = (rad, abierto) => {   // contorno de arco de radio rad (con la base abierta o cerrada)
      const s = new THREE.Shape();
      s.moveTo(-rad, 0); s.lineTo(-rad, recto); s.absarc(0, recto, rad, Math.PI, 0, true); s.lineTo(rad, 0);
      if (!abierto) s.lineTo(-rad, 0);
      return s;
    };
    texturaPiedra = texturaPiedra || crearTexturaPiedra();
    const hueco = new THREE.Mesh(new THREE.ShapeGeometry(arco(r), 16), new THREE.MeshStandardMaterial({ color: '#2b241c', roughness: 1 }));
    hueco.position.z = 0.005;
    // dovelas: la corona entre el arco de fuera y el de dentro, con algo de grosor
    const corona = arco(r + dovela, false);
    const dentro = new THREE.Path();
    dentro.moveTo(-r, 0); dentro.lineTo(-r, recto); dentro.absarc(0, recto, r, Math.PI, 0, true); dentro.lineTo(r, 0); dentro.lineTo(-r, 0);
    corona.holes.push(dentro);
    const tex = texturaPiedra.tex.clone();
    tex.needsUpdate = true;
    tex.repeat.set(1 / texturaPiedra.metros, 1 / texturaPiedra.metros);
    const dovelas = new THREE.Mesh(new THREE.ExtrudeGeometry(corona, { depth: 0.08, bevelEnabled: false, curveSegments: 16 }),
      new THREE.MeshStandardMaterial({ map: tex, color: '#e6dccb', roughness: 0.95 }));
    const g = new THREE.Group();
    g.add(hueco, dovelas);
    this.el.setObject3D('mesh', g);
  },
  remove() { this.el.removeObject3D('mesh'); }
});

// Puerta que se abre y se cierra al hacer clic en ella: gatillo apuntando con el mando,
// o clic del ratón con la mira en el centro de la pantalla. Gira sobre las bisagras hacia dentro.
// Al apuntarla, el pomo brilla y crece, sale un cartel "Abrir"/"Cerrar" y el rayo se pone verde.
const RAYO = '#ffe066', RAYO_PUERTA = '#5cff8a';

AFRAME.registerComponent('puerta', {
  schema: { abierta: { default: -100 } },   // grados al abrirse
  init() {
    this.abierta = false;
    this.apuntada = false;
    this.pomo = this.el.querySelector('.pomo');
    this.carteles = [...this.el.querySelectorAll('.cartel')];
    this.el.addEventListener('click', () => {
      this.abierta = !this.abierta;
      for (const c of this.carteles) c.querySelector('a-text').setAttribute('value', this.abierta ? 'Cerrar' : 'Abrir');
      this.el.setAttribute('animation', {
        property: 'rotation', to: `0 ${this.abierta ? this.data.abierta : 0} 0`,
        dur: 700, easing: 'easeInOutQuad'
      });
    });
  },
  tick() {
    // ¿algún rayo (mandos o mira) está tocando una parte de la puerta?
    let apuntada = false;
    for (const el of this.el.sceneEl.querySelectorAll('[raycaster]')) {
      const r = el.components.raycaster;
      if (!r || !r.data.enabled) continue;
      const toca = r.intersectedEls.some(e => this.el.contains(e));
      if (el.hasAttribute('laser-controls')) {
        const color = r.intersectedEls.some(e => e.closest('[puerta]')) ? RAYO_PUERTA : RAYO;
        if (r.data.lineColor !== color) el.setAttribute('raycaster', 'lineColor', color);
      }
      apuntada = apuntada || toca;
    }
    if (apuntada === this.apuntada) return;
    this.apuntada = apuntada;
    for (const p of this.pomo.children) p.setAttribute('material', 'emissive', apuntada ? '#ffcc33' : '#000');
    this.pomo.object3D.scale.setScalar(apuntada ? 1.5 : 1);
    for (const c of this.carteles) c.object3D.visible = apuntada;
  }
});

// Pantalla del PC en la pared: pide al servidor local una captura del escritorio
// (/__pantalla.jpg) en cuanto llega la anterior, como mucho una por segundo.
// Si no hay servidor (p. ej. abriendo el archivo directamente), muestra "Sin imagen del PC".
AFRAME.registerComponent('pantalla-pc', {
  schema: { cada: { default: 1000 } },   // ms entre capturas
  init() {
    this.tex = null;
    this.aviso = this.el.querySelector('a-text');
    this.marco = this.el.parentNode.querySelector('.marco');
    this.pedir = this.pedir.bind(this);
    this.pedir();
  },
  pedir() {
    const img = new Image(), t0 = performance.now();
    img.onload = () => {
      this.mostrar(img);
      setTimeout(this.pedir, Math.max(0, this.data.cada - (performance.now() - t0)));
    };
    img.onerror = () => { this.aviso.setAttribute('visible', true); setTimeout(this.pedir, 3000); };
    img.src = '/__pantalla.jpg?t=' + Date.now();
  },
  mostrar(img) {
    const malla = this.el.getObject3D('mesh');
    if (!malla) return;
    this.aviso.setAttribute('visible', false);
    const t = this.tex;
    if (t && t.image.width === img.width && t.image.height === img.height) {
      t.image = img;
      t.needsUpdate = true;
      return;
    }
    // primera imagen o cambio de resolución: textura nueva y alto según la proporción
    if (t) t.dispose();
    this.tex = new THREE.Texture(img);
    this.tex.colorSpace = THREE.SRGBColorSpace;
    this.tex.anisotropy = 8;
    this.tex.needsUpdate = true;
    malla.material.map = this.tex;
    malla.material.color.set('#ffffff');
    malla.material.needsUpdate = true;
    const ancho = parseFloat(this.el.getAttribute('width'));
    const alto = ancho * img.height / img.width;
    this.el.setAttribute('height', alto);
    this.marco.setAttribute('height', alto + 0.06);
  }
});

// Objetos que se cogen con el gatillo lateral (grip): apuntar con el rayo y apretarlo.
// Mientras está apretado, el objeto sigue al mando como si estuviera en la mano;
// al soltarlo se queda donde esté. Al apuntarlo, el marco se ilumina.
// Con 'clave', además: el botón B o Y lo trae delante de la cabeza, mirándote, y el sitio
// donde se deja se guarda en el navegador para que siga ahí al recargar.
AFRAME.registerComponent('agarrable', {
  schema: { clave: { default: '' } },
  init() {
    this.mano = null;                      // mando que lo tiene cogido
    this.offset = new THREE.Matrix4();     // posición del objeto respecto al mando
    this.marco = this.el.querySelector('.marco');
    this.iluminado = false;
    for (const m of this.el.sceneEl.querySelectorAll('[laser-controls]')) {
      m.addEventListener('gripdown', () => this.coger(m));
      m.addEventListener('gripup', () => { if (this.mano === m) { this.mano = null; this.guardar(); } });
      if (this.data.clave) for (const b of ['bbuttondown', 'ybuttondown']) m.addEventListener(b, () => this.traer());
    }
    if (this.data.clave) {
      const volver = () => {
        try {
          const p = JSON.parse(localStorage.getItem(this.data.clave));
          if (p) { this.el.object3D.position.fromArray(p.pos); this.el.object3D.quaternion.fromArray(p.giro); }
        } catch (e) {}
      };
      if (this.el.sceneEl.hasLoaded) volver(); else this.el.sceneEl.addEventListener('loaded', volver, { once: true });
    }
  },
  traer() {
    const cam = this.el.sceneEl.camera.el.object3D;
    const cabeza = cam.getWorldPosition(new THREE.Vector3());
    const delante = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.getWorldQuaternion(new THREE.Quaternion()));
    delante.y = 0; delante.normalize();
    const o = this.el.object3D;
    o.position.copy(cabeza).addScaledVector(delante, 1.3);
    o.lookAt(cabeza.x, o.position.y, cabeza.z);   // de frente, sin inclinar
    this.guardar();
  },
  guardar() {
    if (!this.data.clave) return;
    const o = this.el.object3D;
    try { localStorage.setItem(this.data.clave, JSON.stringify({ pos: o.position.toArray(), giro: o.quaternion.toArray() })); } catch (e) {}
  },
  apunta(m) {
    const r = m.components.raycaster;
    return !!r && r.intersectedEls.some(e => this.el.contains(e));
  },
  coger(m) {
    if (this.mano || !this.apunta(m)) return;
    this.mano = m;
    m.object3D.updateMatrixWorld();
    this.el.object3D.updateMatrixWorld();
    this.offset.copy(m.object3D.matrixWorld).invert().multiply(this.el.object3D.matrixWorld);
  },
  tick() {
    const o = this.el.object3D;
    if (this.mano) {
      // el objeto cuelga directamente de la escena, así que su matriz local es la del mundo
      const m = this.mano.object3D.matrixWorld.clone().multiply(this.offset);
      m.decompose(o.position, o.quaternion, o.scale);
    }
    const ilumina = !!this.mano || [...this.el.sceneEl.querySelectorAll('[laser-controls]')].some(m => this.apunta(m));
    if (ilumina !== this.iluminado) {
      this.iluminado = ilumina;
      this.marco.setAttribute('material', 'emissive', ilumina ? '#3a6fd8' : '#000');
    }
  }
});

// Biblioteca: mueble de madera con baldas, lleno de libros de colores y alturas variadas
// (siempre los mismos: el azar tiene semilla fija). El frente mira hacia +z local.
AFRAME.registerComponent('biblioteca', {
  schema: { ancho: { default: 1.6 }, alto: { default: 2 }, fondo: { default: 0.35 }, baldas: { default: 5 } },
  init() {
    const { ancho, alto, fondo, baldas } = this.data, g = 0.025, madera = '#7a5230';
    const caja = (x, y, z, w, h, d, color) => {
      const b = document.createElement('a-box');
      b.setAttribute('position', `${x} ${y} ${z}`);
      b.setAttribute('width', w); b.setAttribute('height', h); b.setAttribute('depth', d);
      b.setAttribute('color', color);
      this.el.appendChild(b);
    };
    caja(-ancho / 2 + g / 2, alto / 2, 0, g, alto, fondo, madera);              // laterales
    caja(ancho / 2 - g / 2, alto / 2, 0, g, alto, fondo, madera);
    caja(0, alto / 2, -fondo / 2 + g / 2, ancho - 2 * g, alto, g, '#5e3f24');   // fondo
    const hueco = (alto - g) / baldas;
    for (let i = 0; i <= baldas; i++) caja(0, i * hueco + g / 2, 0, ancho - 2 * g, g, fondo, madera);
    let semilla = 11;
    const azar = () => (semilla = (semilla * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < baldas; i++) {
      const y0 = i * hueco + g, fin = ancho / 2 - g - 0.01;
      let x = -ancho / 2 + g + 0.01;
      while (true) {
        if (azar() < 0.06) { x += 0.06 + azar() * 0.12; continue; }   // algún hueco
        const w = 0.02 + azar() * 0.035;
        if (x + w > fin) break;
        const h = (hueco - g) * (0.6 + azar() * 0.32), d = fondo * (0.6 + azar() * 0.25);
        // colores apagados de lomo de libro (granates, marrones, verdes, azules oscuros, crema)
        const tono = [0, 8, 18, 28, 35, 45, 95, 140, 200, 215, 225, 280, 340][Math.floor(azar() * 13)];
        const color = `hsl(${tono}, ${18 + azar() * 25}%, ${16 + azar() * 22}%)`;
        caja(x + w / 2, y0 + h / 2, -fondo / 2 + g + d / 2, w, h, d, color);
        x += w + 0.002;
      }
    }
  }
});

// Escalera de la sala 3 (al estilo de la Escalera Dorada de Burgos) y galería superior.
// La escalera ocupa toda la pared del fondo (z = 14), de pared lateral a pared lateral, en dos
// franjas: la de delante (z = 11,2…12,6) y la de atrás (z = 12,6…14), pegada al fondo.
//  1. tramo central ancho (x = 4,8…7,2) que sube hacia el fondo hasta un rellano a 1,2 m,
//     delante de un nicho;
//  2. desde ahí, por la franja de DELANTE, un tramo corto hacia cada lado hasta un rellano a 2 m
//     que llega hasta la pared lateral (en la esquina ocupa también la franja de atrás);
//  3. desde cada rellano, por la franja de ATRÁS, pegado al fondo, un tramo largo vuelve hacia el
//     centro y los dos se juntan en el rellano de arriba (x = 4,7…7,3), a 4,4 m, ante la puerta.
// Arriba, desde el rellano, un arco en la pared del fondo lleva a los pasillos que rodean la
// sala por fuera de sus muros (componentes muro-arcos y pasillos-arriba).
// Barandillas doradas. Peldaños de 20 × 30 cm. Todo en coordenadas del mundo (la entidad va en
// el origen). Rellena SUPERFICIES: la escalera es maciza; la galería se puede pasar por debajo.
AFRAME.registerComponent('escalera-sala3', {
  init() {
    const PIEDRA = '#cdbb98', HUELLA = '#ddd0b4', OSCURA = '#5e3d22', ORO = 'color: #d4a637; metalness: 0.7; roughness: 0.3';
    const H = ALTO_GALERIA;
    const caja = (x0, x1, y0, y1, z0, z1, color, extra) => {
      const b = document.createElement('a-box');
      b.setAttribute('position', `${(x0 + x1) / 2} ${(y0 + y1) / 2} ${(z0 + z1) / 2}`);
      b.setAttribute('width', x1 - x0); b.setAttribute('height', y1 - y0); b.setAttribute('depth', z1 - z0);
      b.setAttribute('color', color);
      if (extra) b.setAttribute(extra, '');
      this.el.appendChild(b);
    };
    const barra = (a, b, grosor) => {   // barrote o pasamanos dorado de a a b (puede ir inclinado)
      const p = new THREE.Vector3(...a), q = new THREE.Vector3(...b);
      const dir = q.clone().sub(p), largo = dir.length();
      // el giro se pone como cuaternión al cargar la caja: pasado a grados por el atributo
      // rotation salía torcido (A-Frame no aplica los ejes en el mismo orden que un Euler)
      const giro = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1, 0, 0), dir.normalize());
      const m = p.clone().add(q).multiplyScalar(0.5);
      const el = document.createElement('a-box');
      el.setAttribute('position', `${m.x} ${m.y} ${m.z}`);
      el.addEventListener('loaded', () => el.object3D.quaternion.copy(giro), { once: true });
      el.setAttribute('width', largo); el.setAttribute('height', grosor); el.setAttribute('depth', grosor);
      el.setAttribute('material', ORO);
      this.el.appendChild(el);
    };
    // barandilla entre dos puntos del borde; en los tramos, a y b son los cantos del primer y del
    // último peldaño, y el pasamanos va paralelo a la línea de cantos. Cada barrote arranca de la
    // pisada que tiene debajo (no de la línea inclinada) y llega hasta el pasamanos.
    const pisadaEn = (x, z, cerca) => {
      let mejor = cerca;
      for (const s of SUPERFICIES)
        if (dentro({ x, z }, s) && Math.abs(s.y - cerca) < 0.35 && (mejor === cerca || Math.abs(s.y - cerca) < Math.abs(mejor - cerca))) mejor = s.y;
      return mejor;
    };
    const barandilla = (a, b) => {
      const n = Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[2] - a[2]) / 0.15));
      for (let k = 0; k <= n; k++) {
        const f = k / n, x = a[0] + (b[0] - a[0]) * f, y = a[1] + (b[1] - a[1]) * f, z = a[2] + (b[2] - a[2]) * f;
        barra([x, pisadaEn(x, z, y), z], [x, y + 0.9, z], 0.025);
      }
      barra([a[0], a[1] + 0.9, a[2]], [b[0], b[1] + 0.9, b[2]], 0.06);
      if (a[1] === b[1]) barra([a[0], a[1] + 0.08, a[2]], [b[0], b[1] + 0.08, b[2]], 0.04);   // listón de abajo, solo en rellanos
    };
    const pisable = (x0, x1, z0, z1, y, macizo) => SUPERFICIES.push({ x0, x1, z0, z1, y, macizo });
    // peldaño o rellano macizo, de piedra, hasta el suelo; la pisada, de losas de roca
    const peldano = (x0, x1, z0, z1, y) => {
      caja(x0, x1, 0, y - 0.04, z0, z1, PIEDRA, 'piedra-mundo');
      caja(x0 - 0.01, x1 + 0.01, y - 0.04, y, z0 - 0.01, z1 + 0.01, HUELLA);
      const roca = document.createElement('a-plane');
      roca.setAttribute('rotation', '-90 0 0');
      roca.setAttribute('position', `${(x0 + x1) / 2} ${y + 0.002} ${(z0 + z1) / 2}`);
      roca.setAttribute('width', x1 - x0 + 0.02); roca.setAttribute('height', z1 - z0 + 0.02);
      roca.setAttribute('color', '#ffffff'); roca.setAttribute('pared-piedra', '');
      this.el.appendChild(roca);
      pisable(x0, x1, z0, z1, y, true);
    };
    // 1. tramo central (5 peldaños) y rellano, en la franja de delante
    for (let i = 1; i <= 5; i++) peldano(4.8, 7.2, 9.7 + (i - 1) * 0.3, 9.7 + i * 0.3, 0.2 * i);
    peldano(4.8, 7.2, 11.2, 12.6, 1.2);
    barandilla([4.83, 0.2, 9.72], [4.83, 1.2, 11.22]);
    barandilla([7.17, 0.2, 9.72], [7.17, 1.2, 11.22]);

    // 2 y 3, a cada lado (espejo: x → 12 - x para el lado izquierdo)
    const lado = espejo => {
      const pel = (xa, xb, z0, z1, y) => peldano(Math.min(espejo(xa), espejo(xb)), Math.max(espejo(xa), espejo(xb)), z0, z1, y);
      // 2. hacia la pared lateral por la franja de delante: 3 peldaños y rellano a 2 m hasta la pared
      for (let k = 1; k <= 3; k++) pel(4.8 - k * 0.3, 4.8 - (k - 1) * 0.3, 11.2, 12.6, 1.2 + 0.2 * k);
      pel(0, 3.9, 11.2, 12.6, 2.0);
      pel(0, 1.4, 12.6, 14, 2.0);
      barandilla([espejo(4.78), 1.4, 11.23], [espejo(3.88), 2.0, 11.23]);
      barandilla([espejo(3.9), 2.0, 11.23], [espejo(0), 2.0, 11.23]);
      // 3. de vuelta al centro por la franja de atrás, pegado al fondo: 11 peldaños de 2,2 a 4,2 m
      for (let m = 1; m <= 11; m++) pel(1.4 + (m - 1) * 0.3, 1.4 + m * 0.3, 12.6, 14, 2.0 + 0.2 * m);
      barandilla([espejo(1.42), 2.2, 12.63], [espejo(4.72), H, 12.63]);
    };
    lado(x => x);        // a la derecha entrando (junto a x = 0)
    lado(x => 12 - x);   // a la izquierda entrando (junto a x = 12)

    // un arco ciego en el frente de cada rellano lateral (debajo, como en Burgos)
    for (const x of [1.95, 10.05]) {
      const a = document.createElement('a-entity');
      a.setAttribute('arco-ciego', 'ancho: 1.6; alto: 1.75');
      a.setAttribute('position', `${x} 0 11.19`);
      a.setAttribute('rotation', '0 180 0');
      this.el.appendChild(a);
    }

    // rellano de arriba, macizo, en la franja de atrás; por delante, un nicho oscuro sobre el
    // rellano del tramo central (como en Burgos)
    peldano(4.7, 7.3, 12.6, 14, H);
    caja(5.3, 6.7, 1.2, 3.3, 12.56, 12.6, '#3a2c20');
    caja(5.2, 6.8, 3.3, 3.42, 12.52, 12.6, '#b8a27c');
    barandilla([4.7, H, 12.57], [7.3, H, 12.57]);   // borde del rellano de arriba
  }
});

// Muro de piedra con arcos (sala 3): un muro de "largo" × "alto" y "grosor" de espesor, con
// arcos de medio punto abiertos desde "base" (para ver y pasar a los pasillos de arriba) y,
// si se da, un hueco de entrada a ras de suelo ("entrada": desde, hasta, alto). Coordenadas
// locales: x a lo largo del muro, y hacia arriba; el espesor crece hacia +z local (hacia fuera
// de la sala), así que la cara de dentro queda en z = 0. Textura de piedra en metros reales.
AFRAME.registerComponent('muro-arcos', {
  schema: {
    largo: { default: 12 }, alto: { default: 7.5 }, grosor: { default: 0.4 },
    arcos: { type: 'array', default: [] }, ancho: { default: 1.2 },
    base: { default: ALTO_GALERIA }, recto: { default: 1.6 },   // tramo recto del hueco antes del arco
    entrada: { type: 'array', default: [] }
  },
  init() {
    const d = this.data, r = d.ancho / 2;
    const forma = new THREE.Shape();
    forma.moveTo(0, 0);
    if (d.entrada.length === 3) {
      const [e0, e1, eh] = d.entrada.map(Number);
      forma.lineTo(e0, 0); forma.lineTo(e0, eh); forma.lineTo(e1, eh); forma.lineTo(e1, 0);
    }
    forma.lineTo(d.largo, 0); forma.lineTo(d.largo, d.alto); forma.lineTo(0, d.alto); forma.lineTo(0, 0);
    for (const c of d.arcos.map(Number)) {
      const h = new THREE.Path();
      h.moveTo(c - r, d.base); h.lineTo(c + r, d.base); h.lineTo(c + r, d.base + d.recto);
      h.absarc(c, d.base + d.recto, r, 0, Math.PI, false);
      h.lineTo(c - r, d.base);
      forma.holes.push(h);
    }
    const geo = new THREE.ExtrudeGeometry(forma, { depth: d.grosor, bevelEnabled: false, curveSegments: 12 });
    texturaPiedra = texturaPiedra || crearTexturaPiedra();
    const tex = texturaPiedra.tex.clone();
    tex.needsUpdate = true;
    tex.repeat.set(1 / texturaPiedra.metros, 1 / texturaPiedra.metros);
    this.el.setObject3D('mesh', new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95 })));
  },
  remove() { this.el.removeObject3D('mesh'); }
});

// Pasillos de arriba de la sala 3: rodean la sala por fuera de sus muros (que tienen 40 cm de
// espesor), a la altura del rellano de arriba de la escalera (4,4 m), 1,6 m de ancho y 2,6 m de
// alto: suelo de madera, techo, muro exterior de piedra y alguna luz. Se entra por el arco del
// centro de la pared del fondo. Coordenadas del mundo (la entidad va en el origen).
AFRAME.registerComponent('pasillos-arriba', {
  init() {
    const H = ALTO_GALERIA, TECHO = H + 2.6;
    const plano = (pos, rot, w, h, extra) => {
      const p = document.createElement('a-plane');
      p.setAttribute('position', pos.join(' ')); p.setAttribute('rotation', rot);
      p.setAttribute('width', w); p.setAttribute('height', h); p.setAttribute('color', '#ffffff');
      if (extra) p.setAttribute(extra, '');
      this.el.appendChild(p);
    };
    // suelos (y lo que se pisa), techos: el anillo entre los muros de la sala y el exterior
    const tramos = [[-2, 14, 14.4, 16], [-2, 14, 2, 3.6], [-2, -0.4, 3.6, 14.4], [12.4, 14, 3.6, 14.4], [5.4, 6.6, 14, 14.4]];
    for (const [x0, x1, z0, z1] of tramos) {
      const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
      plano([cx, H, cz], '-90 0 0', x1 - x0, z1 - z0, 'suelo-madera');
      plano([cx, TECHO, cz], '90 0 0', x1 - x0, z1 - z0);
      SUPERFICIES.push({ x0, x1, z0, z1, y: H, macizo: false });
    }
    // muro exterior, mirando hacia dentro del pasillo
    const m = (TECHO + H) / 2, alto = TECHO - H;
    plano([6, m, 16], '0 180 0', 16, alto, 'pared-piedra');
    plano([6, m, 2], '0 0 0', 16, alto, 'pared-piedra');
    plano([-2, m, 9], '0 90 0', 14, alto, 'pared-piedra');
    plano([14, m, 9], '0 -90 0', 14, alto, 'pared-piedra');
    for (const [x, z] of [[6, 15.2], [-1.2, 9], [13.2, 9], [6, 2.8]]) {
      const l = document.createElement('a-entity');
      l.setAttribute('light', 'type: point; intensity: 0.9; distance: 9; color: #fff4dc');
      l.setAttribute('position', `${x} ${TECHO - 0.4} ${z}`);
      this.el.appendChild(l);
    }
  }
});

// Informe de posición para Claude: cada segundo manda al servidor (POST /__posicion)
// dónde está la cabeza, en qué zona, hacia dónde mira y qué punto de la escena tiene
// delante (rayo desde el centro de la vista). Así se pueden colocar cosas "donde estoy" o
// "donde miro". Coordenadas en metros: x hacia la puerta/pasillo, y hacia arriba, z hacia
// la pared del fondo de la primera sala (la de la ventana está en z = -3).
AFRAME.registerComponent('informe-posicion', {
  init() {
    this.rayo = new THREE.Raycaster();
    this.rayo.far = 30;
    setInterval(() => this.enviar(), 1000);
  },
  enviar() {
    if (document.hidden) return;   // solo informa la página que se está usando
    const cam = this.el.querySelector('[camera]').object3D;
    const cabeza = cam.getWorldPosition(new THREE.Vector3());
    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.getWorldQuaternion(new THREE.Quaternion()));
    const rigY = document.getElementById('rig').object3D.position.y;   // altura del suelo que pisa
    const zona = dentro(cabeza, SALA) ? 'sala 1' : dentro(cabeza, PASILLO) ? 'pasillo' : dentro(cabeza, SALA2) ? 'sala 2' : dentro(cabeza, PASILLO2) ? 'pasillo 2' : dentro(cabeza, SALA3) ? (rigY > 2 ? (rigY > 4.3 ? 'sala 3 (rellano de arriba)' : 'sala 3 (en la escalera)') : 'sala 3') : rigY > 4.3 && [ARCO_ARRIBA, ...PASILLOS_ARRIBA].some(z => dentro(cabeza, z)) ? 'pasillos de arriba (sala 3)' : 'fuera';
    // ¿qué tiene delante? (solo mallas visibles, sin el rig ni los rayos de los mandos)
    const rig = document.getElementById('rig').object3D;
    const mallas = [];
    this.el.object3D.traverseVisible(o => {
      if (!o.isMesh || !o.material || o.material.visible === false) return;
      for (let p = o; p; p = p.parent) if (p === rig) return;
      mallas.push(o);
    });
    this.rayo.set(cabeza, dir);
    const toca = this.rayo.intersectObjects(mallas, false)[0];
    let mira = null;
    if (toca) {
      let el = toca.object.el;
      while (el && !el.tagName.startsWith('A-')) el = el.parentNode;
      const n = toca.face ? toca.face.normal.clone().transformDirection(toca.object.matrixWorld) : null;
      mira = {
        punto: r3(toca.point), distancia: +toca.distance.toFixed(2),
        normal: n && r3(n),
        objeto: el && { etiqueta: el.tagName.toLowerCase(), clase: el.className || undefined,
                        color: el.getAttribute('color') || undefined, posicion: r3(el.object3D.getWorldPosition(new THREE.Vector3())) }
      };
    }
    const informe = {
      hora: new Date().toLocaleTimeString(), vr: this.el.is('vr-mode'), zona,
      cabeza: r3(cabeza), suelo: r3({ x: cabeza.x, y: rigY, z: cabeza.z }),
      direccion: r3(dir), rumbo: Math.round(THREE.MathUtils.radToDeg(Math.atan2(dir.x, -dir.z))),   // 0 = hacia z negativa (ventana), 90 = hacia x positiva (puerta)
      mira
    };
    fetch('/__posicion', { method: 'POST', body: JSON.stringify(informe) }).catch(() => {});
  }
});
const r3 = v => ({ x: +v.x.toFixed(2), y: +v.y.toFixed(2), z: +v.z.toFixed(2) });
</script>
