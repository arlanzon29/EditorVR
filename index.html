<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor VR</title>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.7.0/dist/aframe-master.min.js"></script>
<!-- Comportamiento: componentes de A-Frame en js/ (el orden importa poco: se usan al arrancar) -->
<script src="js/incluir.js"></script>
<script src="js/movimiento.js"></script>
<script src="js/texturas.js"></script>
<script src="js/objetos.js"></script>
<script src="js/conexion.js"></script>
</head>
<body>
<!-- La escena: aquí el jugador (rig), la luz general y las estancias. Cada estancia está en
     salas/ y se carga con el componente incluir; sus coordenadas son las del mundo. -->
<a-scene informe-posicion foto-para-claude renderer="antialias: true; colorManagement: true" xr-mode-ui="enabled: true" background="color: #a9cfe8">

  <!-- Inicio: en la sala 3, mirando a la escalera -->
  <a-entity id="rig" position="6 0 7" rotation="0 180 0">
    <a-entity camera look-controls="pointerLockEnabled: true" wasd-controls="enabled: false" position="0 1.6 0"
              cursor raycaster="objects: .clicable; far: 4">
      <!-- mira (solo en el monitor) -->
      <a-ring class="mira" radius-inner="0.004" radius-outer="0.007" position="0 0 -0.5"
              material="shader: flat; color: #333; opacity: 0.8"></a-ring>
    </a-entity>
    <a-entity laser-controls="hand: left" raycaster="objects: .clicable; far: 4; lineColor: #ffe066" andar-joystick></a-entity>
    <a-entity laser-controls="hand: right" raycaster="objects: .clicable; far: 4; lineColor: #ffe066" giro-por-pasos></a-entity>
  </a-entity>

  <!-- Luz suave: todo blanco, pero con la sombra justa para distinguir suelo, paredes y techo -->
  <a-entity light="type: ambient; intensity: 2.2; color: #fff"></a-entity>
  <a-entity light="type: directional; intensity: 1.2; color: #fff" position="1 3 2"></a-entity>

  <!-- Estancias -->
  <a-entity incluir="salas/sala1.html"></a-entity>
  <a-entity incluir="salas/pasillo.html"></a-entity>
  <a-entity incluir="salas/sala2.html"></a-entity>
  <a-entity incluir="salas/pasillo2.html"></a-entity>
  <a-entity incluir="salas/sala3.html"></a-entity>
  <a-entity incluir="salas/comedor.html"></a-entity>
  <a-entity incluir="salas/patio.html"></a-entity>
</a-scene>
</body>
</html>
