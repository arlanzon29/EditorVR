<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor VR</title>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.7.0/dist/aframe-master.min.js"></script>
<!-- Comportamiento: componentes de A-Frame en js/ (el orden importa poco: se usan al arrancar) -->
<script src="js/mundo.js"></script>
<script src="js/partida.js"></script>
<script src="js/rendimiento.js"></script>
<script src="js/incluir.js"></script>
<script src="js/zonas.js"></script>
<script src="js/movimiento.js"></script>
<script src="js/texturas.js"></script>
<script src="js/objetos.js"></script>
<script src="js/lago.js"></script>
<script src="js/poblado.js"></script>
<script src="js/taberna.js"></script>
<script src="js/posada.js"></script>
<script src="js/menu.js"></script>
<script src="js/boda.js"></script>
<script src="js/animales.js"></script>
<script src="js/mapa.js"></script>
<script src="js/arboles.js"></script>
<script src="js/conexion.js"></script>
<script src="js/medidor.js"></script>
<script src="js/pregunta.js"></script>
<script src="js/oficios.js"></script>
<script src="js/casa.js"></script>
<script src="js/estrellas.js"></script>
</head>
<body>
<!-- La escena: aquí el jugador (rig) y la luz general. Las estancias están en salas/, con las
     coordenadas del mundo, y las carga el componente zonas (js/zonas.js) según dónde estés. -->
<a-scene zonas cielo mapa partida informe-posicion foto-para-claude medidor luces-cercanas calidad-vr renderer="antialias: true; colorManagement: true; foveationLevel: 0.3" xr-mode-ui="enabled: true" background="color: #a9cfe8">

  <!-- Inicio: en la sala 3, mirando a la escalera -->
  <a-entity id="rig" position="6 0 7" rotation="0 180 0">
    <a-entity camera look-controls="pointerLockEnabled: true; magicWindowTrackingEnabled: false" wasd-controls="enabled: false" position="0 1.6 0"
              cursor raycaster="objects: .clicable; far: 4" rayo-verde>
      <!-- mira (solo en el monitor) -->
      <!-- (clara con un borde oscuro, por encima de los carteles: sobre madera oscura, una mira oscura no se vería) -->
      <a-ring class="mira" radius-inner="0.004" radius-outer="0.007" position="0 0 -0.5" encima="orden: 1000"
              material="shader: flat; color: #f4ead0; opacity: 0.9; depthTest: false">
        <a-ring radius-inner="0.0068" radius-outer="0.0095" encima="orden: 999"
                material="shader: flat; color: #2a1c10; opacity: 0.85; depthTest: false"></a-ring>
      </a-ring>
    </a-entity>
    <a-entity laser-controls="hand: left" raycaster="objects: .clicable; far: 4; lineColor: #ffe066" rayo-verde andar-joystick></a-entity>
    <a-entity laser-controls="hand: right" raycaster="objects: .clicable; far: 4; lineColor: #ffe066" rayo-verde giro-por-pasos></a-entity>
  </a-entity>

  <!-- Luz general, para lo que no está horneado: cada zona pone la suya (ATMOSFERA, en js/zonas.js) -->
  <a-entity id="luz-ambiente" light="type: ambient; intensity: 1.3; color: #c9a8b0"></a-entity>
  <a-entity id="luz-sol" light="type: directional; intensity: 2; color: #ffab66" position="-1 0.2 0.25"></a-entity>
</a-scene>
</body>
</html>
