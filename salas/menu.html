<!-- Menú principal: un gran salón de piedra (20 × 15 m, 10 de alto), cerrado y lejos del mundo, con la tabla de las
     partidas en la pared del fondo (js/menu.js). Lo primero que se ve: la sala entera y, al fondo, la tabla entre dos
     caballeros de piedra y dos antorchas, alumbrada por un haz de luz de luna que entra por un óculo en el centro del
     techo (oculo, js/menu.js); delante de la tabla, un mosaico con una rosa de los vientos; una alfombra hasta él; y a
     los lados, columnas con arcos ciegos, cada uno con su estandarte y un candelabro de pie que alumbra la pared;
     arriba, un techo de vigas con dos lámparas de rueda. No va horneado: todo con sus luces. Se anda por el salón
     (andar, en MUNDO.menu); al llegar, te deja al fondo, mirando a la tabla (MENU_SITIO, en js/partida.js). -->

<!-- suelo de losas; techo de madera a 10 m, de una pieza, con el agujero redondo del óculo en el centro, y sus vigas,
     que no lo tocan; y los muros (el del fondo, el de la tabla, en z = -1) -->
<a-plane rotation="-90 0 0" position="2050 0 6.5" width="20" height="15" color="#b8b0a2" pared-piedra></a-plane>
<a-entity techo-con-hueco="ancho: 20; fondo: 15; radio: 1.2" position="2050 10 6.5"></a-entity>

  <a-box position="2050 9.85 4.75" width="20" height="0.3" depth="0.35" color="#3a281a"></a-box>
  <a-box position="2050 9.85 8.25" width="20" height="0.3" depth="0.35" color="#3a281a"></a-box>
  <a-box position="2050 9.85 11.75" width="20" height="0.3" depth="0.35" color="#3a281a"></a-box>
</a-entity>
<a-box position="2050 5 -1.2" width="20.8" height="10" depth="0.4" piedra-mundo="tono: #8a847a"></a-box>
<a-box position="2050 5 14.2" width="20.8" height="10" depth="0.4" piedra-mundo="tono: #8a847a"></a-box>

<!-- el óculo, con la luna: su haz, del ancho del agujero, cae en diagonal sobre la pared del fondo, en la tabla; y una
     luz fría de verdad allí -->

<a-entity light="type: point; intensity: 1.2; distance: 8; color: #a8bce0" position="2050 2.6 1"></a-entity>
<a-entity mosaico position="2050 0.012 0.9"></a-entity>

<!-- la alfombra granate con su cenefa, de la puerta hasta el mosaico -->
