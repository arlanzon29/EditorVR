<!-- Menú principal: un gran salón de piedra (20 × 15 m, 10 de alto), cerrado y lejos del mundo, con la tabla de las
     partidas en la pared del fondo (js/menu.js). Es lo primero que se ve: a los lados de la tabla, dos caballeros de
     piedra y dos antorchas; delante, un mosaico con una rosa de los vientos donde cae la luz de la luna, que entra en
     diagonal por un óculo del techo (oculo y mosaico, js/menu.js); una alfombra hasta él; y a los lados, columnas con
     arcos ciegos, cada uno con su estandarte y un candelabro de pie que alumbra la pared; arriba, un techo de vigas
     con dos lámparas de rueda. Se anda por el salón (andar, en MUNDO.menu); al llegar, te deja delante de la tabla
     (MENU_SITIO, en js/partida.js). -->
