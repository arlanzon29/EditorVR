<!-- Sala 1 (x, z = -3…3, 3 m de alto): ventana, mesa, silla, biblioteca, pantalla del PC y puerta al pasillo -->
<!-- Habitación -->
<a-plane rotation="-90 0 0" width="6" height="6" color="#ffffff" suelo-madera></a-plane>
<!-- Techo de tablas de madera con 5 vigas de 15 × 20 cm de pared a pared (1 cm más cortas por
     cada lado: la pared de la puerta es de doble cara y las puntas asomaban por fuera) -->
<a-plane rotation="90 0 0" position="0 3 0" width="6" height="6" color="#ffffff" suelo-madera></a-plane>
<a-entity>
  <a-box position="0 2.9 -2.4" width="5.98" height="0.2" depth="0.15" color="#5e3d22"></a-box>
  <a-box position="0 2.9 -1.2" width="5.98" height="0.2" depth="0.15" color="#5e3d22"></a-box>
  <a-box position="0 2.9 0" width="5.98" height="0.2" depth="0.15" color="#5e3d22"></a-box>
  <a-box position="0 2.9 1.2" width="5.98" height="0.2" depth="0.15" color="#5e3d22"></a-box>
  <a-box position="0 2.9 2.4" width="5.98" height="0.2" depth="0.15" color="#5e3d22"></a-box>
</a-entity>
<!-- Pared de la ventana, en cuatro trozos alrededor del hueco (x = -1…1, y = 0,95…2,25) -->
<a-plane position="-2 1.5 -3" width="2" height="3" color="#ffffff" pared-piedra></a-plane>
<a-plane position="2 1.5 -3" width="2" height="3" color="#ffffff" pared-piedra></a-plane>
<a-plane position="0 0.475 -3" width="2" height="0.95" color="#ffffff" pared-piedra></a-plane>
<a-plane position="0 2.625 -3" width="2" height="0.75" color="#ffffff" pared-piedra></a-plane>
<a-plane position="0 1.5 3" rotation="0 180 0" width="6" height="3" color="#ffffff" pared-piedra></a-plane>
<a-plane position="-3 1.5 0" rotation="0 90 0" width="6" height="3" color="#ffffff" pared-piedra></a-plane>
<a-plane position="3 1.5 -1.725" rotation="0 -90 0" width="2.55" height="3" color="#ffffff" pared-piedra side="double"></a-plane>
<a-plane position="3 1.5 1.725" rotation="0 -90 0" width="2.55" height="3" color="#ffffff" pared-piedra side="double"></a-plane>
<a-plane position="3 2.525 0" rotation="0 -90 0" width="0.9" height="0.95" color="#ffffff" pared-piedra side="double"></a-plane>

<!-- Ventana rústica hundida 35 cm en el muro de piedra: jambas de piedra, marco de madera
     oscura con cuarterones (4 × 3), cristal y alféizar de madera. Por ella se ve el campo de
     fuera (salas/exterior.html) -->
<a-plane position="-1 1.6 -3.175" rotation="0 90 0" width="0.35" height="1.3" color="#ffffff" pared-piedra></a-plane>
<a-plane position="1 1.6 -3.175" rotation="0 -90 0" width="0.35" height="1.3" color="#ffffff" pared-piedra></a-plane>
<a-plane position="0 2.25 -3.175" rotation="90 0 0" width="2" height="0.35" color="#ffffff" pared-piedra></a-plane>
<!-- alféizar: 2 cm más corto que el hueco, para no coincidir con la piel de fuera del muro -->
<a-box position="0 0.92 -3.09" width="2.2" height="0.06" depth="0.48" color="#6b4423"></a-box>
<a-entity position="0 1.6 -3.25">
  <a-plane position="0 0 0.01" width="2" height="1.3" material="color: #d6ecff; opacity: 0.18; transparent: true"></a-plane>

<a-entity biblioteca position="-2.19 0 2.815" rotation="0 180 0"></a-entity>
<!-- Pantalla en la pared de enfrente, a la izquierda de la ventana: muestra el escritorio del PC -->
<!-- Se puede coger y colocar con el gatillo lateral (agarrable). -->
<a-entity agarrable="clave: editorvr-pantalla" position="-2 1.6 -2.975">
  <a-box class="marco clicable" width="1.56" height="0.9" depth="0.03" color="#1a1a1a"></a-box>
  <a-plane class="clicable" pantalla-pc position="0 0 0.02" width="1.5" height="0.84" material="shader: flat; color: #222">
    <a-text value="Sin imagen del PC" align="center" color="#bbbbbb" width="2" position="0 0 0.002" visible="false"></a-text>
  </a-plane>
</a-entity>
<!-- Puerta en la pared rosa: marco blanco fijo y hoja de madera de 0,9 × 2,05 m que se abre.
     Entidad girada para que su Z local apunte hacia dentro de la habitación. -->
<a-entity position="3 0 0" rotation="0 -90 0">
  <!-- marco de sillares con dintel de dovelas (modelos/marco-puerta.glb) -->
  <a-entity gltf-model="url(modelos/marco-puerta.glb)" position="0 0 0.01"></a-entity>
  <a-entity puerta id="puerta1" position="-0.45 0 0.02">
    <!-- hoja de Blender (modelos/puerta.glb): tablones, bisagras, travesaños y aldaba;
         la caja invisible y las esferas reciben el rayo -->
    <a-entity gltf-model="url(modelos/puerta.glb)"></a-entity>
    <a-box class="clicable" position="0.45 1.025 0" width="0.9" height="2.05" depth="0.06" material="visible: false"></a-box>
    <a-sphere class="clicable" position="0.74 0.963 0.06" radius="0.1" material="visible: false"></a-sphere>
    <a-sphere class="clicable" position="0.74 0.963 -0.06" radius="0.1" material="visible: false"></a-sphere>
    <a-entity class="cartel" position="0.62 1.163 -0.08" rotation="0 180 0" visible="false">
      <a-plane width="0.3" height="0.1" material="shader: flat; color: #1c2230; opacity: 0.85; transparent: true"></a-plane>
      <a-text value="Abrir" align="center" color="#ffffff" width="1.2" position="0 0 0.002"></a-text>
    </a-entity>
    <a-entity class="cartel" position="0.62 1.163 0.08" visible="false">
      <a-plane width="0.3" height="0.1" material="shader: flat; color: #1c2230; opacity: 0.85; transparent: true"></a-plane>
      <a-text value="Abrir" align="center" color="#ffffff" width="1.2" position="0 0 0.002"></a-text>
    </a-entity>
  </a-entity>
</a-entity>
