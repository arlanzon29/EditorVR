<!-- Exterior: campo delante del castillo, al que se sale por el portón de la muralla del patio.
     Hierba, camino de tierra, árboles y colinas a lo lejos. Además, la piel de fuera de las salas
     que dan al campo (por dentro sus paredes solo tienen cara hacia dentro). -->

<!-- campo: 5 cm por debajo de los suelos de las salas, para no coincidir con ellos -->
<a-plane rotation="-90 0 0" position="5 -0.05 0" width="200" height="200" color="#ffffff" suelo-hierba></a-plane>
<!-- camino de tierra desde el portón hasta el bosque (sigue en bosque.html: los puntos del final coinciden) -->
<a-entity camino="puntos: 6 -6.9, 6.2 -10, 8 -15, 7.6 -20, 4.5 -25, 3.6 -30, 6 -35, 8 -40, 6.6 -44, 6 -45, 5.5 -49"></a-entity>

<!-- piel exterior de la sala 1 y de la sala 2: en el fondo del hueco de sus ventanas (35 cm
     dentro del muro), en cuatro trozos alrededor de él (x o z = -1…1, y = 0,95…2,25), para que
     la ventana se vea desde fuera y desde dentro se vea el campo -->
<a-plane position="-2.225 1.5 -3.35" rotation="0 180 0" width="2.45" height="3" color="#ffffff" pared-piedra></a-plane>
<a-plane position="1.8 1.5 -3.35" rotation="0 180 0" width="1.6" height="3" color="#ffffff" pared-piedra></a-plane>
<a-plane position="0 0.475 -3.35" rotation="0 180 0" width="2" height="0.95" color="#ffffff" pared-piedra></a-plane>
<a-plane position="0 2.625 -3.35" rotation="0 180 0" width="2" height="0.75" color="#ffffff" pared-piedra></a-plane>
<a-plane position="-3.45 1.5 0.075" rotation="0 -90 0" width="7.05" height="3" color="#ffffff" pared-piedra></a-plane>
<a-plane position="11.925 1.5 -2.5" rotation="0 180 0" width="5.05" height="3" color="#ffffff" pared-piedra></a-plane>
<!-- sala 2 por detrás (z = 2,5) y el callejón entre ella y la sala 3 (z = 2,5…3,6), cerrado por el
     este hasta la altura de los pasillos de arriba: si no, por ahí se veía el interior -->
<a-plane position="11.675 1.5 2.5" width="5.35" height="3" color="#ffffff" pared-piedra></a-plane>
<a-plane position="14.35 2.2 3.05" rotation="0 90 0" width="1.1" height="4.4" color="#ffffff" pared-piedra></a-plane>
<a-plane position="14.35 1.5 -1.75" rotation="0 90 0" width="1.5" height="3" color="#ffffff" pared-piedra></a-plane>
<a-plane position="14.35 1.5 1.75" rotation="0 90 0" width="1.5" height="3" color="#ffffff" pared-piedra></a-plane>
<a-plane position="14.35 0.475 0" rotation="0 90 0" width="2" height="0.95" color="#ffffff" pared-piedra></a-plane>
<a-plane position="14.35 2.625 0" rotation="0 90 0" width="2" height="0.75" color="#ffffff" pared-piedra></a-plane>
